<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fashion Studio Runway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4fa; --bg2:#ffe6f3; --surface:#ffffff; --surface2:#fdf0fa; --ink:#3a2152; --muted:#7d6a92;
  --line:#f0d4ea; --pink:#ff5fa2; --pink-d:#e63e88; --purple:#8b5cf6; --purple-d:#6d3fe0;
  --gold:#ffc83d; --onbrand:#ffffff;
  --shadow:0 6px 18px rgba(139,92,246,.18); --scene-top:#ffe3f3; --scene-bot:#e3d8ff;
  --show-top:#1a0f3a; --show-bot:#5b1a68;
  --accent:var(--purple); --accent-d:var(--purple-d); --accent-soft:rgba(139,92,246,.2);
  --r:16px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a0f2e; --bg2:#26143f; --surface:#2a1a47; --surface2:#34215a; --ink:#fdeaff; --muted:#bba6d6;
    --line:#4a3175; --pink:#ff6fb0; --pink-d:#ff8cc2; --purple:#9d78ff; --purple-d:#b79bff;
    --gold:#ffd25a; --onbrand:#ffffff;
    --shadow:0 6px 18px rgba(0,0,0,.45); --scene-top:#3a2160; --scene-bot:#1d1238;
  }
}
:root[data-theme="dark"]{
  --bg:#1a0f2e; --bg2:#26143f; --surface:#2a1a47; --surface2:#34215a; --ink:#fdeaff; --muted:#bba6d6;
  --line:#4a3175; --pink:#ff6fb0; --pink-d:#ff8cc2; --purple:#9d78ff; --purple-d:#b79bff;
  --gold:#ffd25a; --onbrand:#ffffff;
  --shadow:0 6px 18px rgba(0,0,0,.45); --scene-top:#3a2160; --scene-bot:#1d1238;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overflow-x:hidden}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Fredoka','Baloo 2',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit}
.hidden{display:none!important}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* ---- shared button language: one radius, press feedback, obvious selected state ---- */
.btn,.tool,.chip,.sw,.step-tab,.round,.iconbtn,.runway-btn,.back-btn{transition:transform .12s ease,box-shadow .12s ease,background-color .12s ease,border-color .12s ease;cursor:pointer}
.btn:active,.tool:active,.chip:active,.sw:active,.step-tab:active,.round:active,.iconbtn:active,.back-btn:active{transform:scale(.94)}
.runway-btn:active{transform:scale(.96)}
.btn{
  min-height:48px;min-width:48px;padding:0 var(--s4);border-radius:var(--r);border:2px solid var(--line);background:var(--surface2);color:var(--ink);
  font-weight:600;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.big{min-height:52px;font-size:1.1rem}
.btn .dot{display:inline-block;border-radius:50%;background:currentColor}
.btn.sticker{font-size:1.6rem;padding:0;width:48px}
.btn[aria-pressed="true"],.tool[aria-pressed="true"]{
  background:var(--accent);color:#fff;border-color:var(--accent-d);position:relative;z-index:1;
  box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent);transform:translateY(-2px);
}
.btn[aria-pressed="true"]:active,.tool[aria-pressed="true"]:active{transform:translateY(-2px) scale(.94)}

/* ---- header ---- */
header{
  display:flex;align-items:center;gap:var(--s3);justify-content:space-between;min-height:56px;
  padding:var(--s1) var(--s4);background:linear-gradient(90deg,var(--pink),var(--purple));color:var(--onbrand);
  box-shadow:0 3px 14px rgba(139,92,246,.35);z-index:5;
}
header h1{margin:0;min-width:0;font-size:clamp(1.05rem,2.2vw,1.45rem);font-weight:700;letter-spacing:.2px;text-shadow:0 2px 0 rgba(0,0,0,.12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{display:flex;align-items:center;gap:var(--s2);flex:none}
.iconbtn{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.24);color:#fff;font-size:1.3rem;padding:0}
.iconbtn[aria-expanded="true"]{background:#fff;color:var(--purple-d)}
.pop{
  position:fixed;top:60px;right:var(--s4);z-index:40;width:min(320px,calc(100vw - 32px));background:var(--surface);color:var(--ink);
  border:3px solid var(--accent);border-radius:var(--r);padding:var(--s4);box-shadow:0 14px 40px rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:var(--s3);
}
.pop label{font-weight:600}
.pop input{
  min-height:48px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface2);color:var(--ink);padding:0 var(--s3);
  font:inherit;font-size:1.1rem;-webkit-user-select:text;user-select:text;width:100%;
}
.pop input:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}

/* ---- main / stage ---- */
main{display:grid;grid-template-columns:55fr 45fr;min-height:0}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg2)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.stage-ui{position:absolute;left:0;right:0;bottom:var(--s4);display:flex;justify-content:center;pointer-events:none}
.stage-ui>*{pointer-events:auto}
.stage-tools{
  position:absolute;top:var(--s3);right:var(--s3);display:flex;flex-direction:column;gap:var(--s2);padding:var(--s2);border-radius:999px;
  background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:var(--shadow);
}
.round{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.45rem;padding:0;display:grid;place-items:center}
.exit-wrap{position:absolute;top:var(--s3);left:var(--s3)}
.back-btn{
  min-height:56px;padding:0 var(--s5);border-radius:999px;border:3px solid #fff;background:var(--accent);color:#fff;font-weight:700;font-size:1.15rem;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.runway-btn{
  min-height:72px;padding:0 var(--s5);padding-inline:40px;border-radius:999px;border:4px solid #fff;font-size:1.6rem;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 10px 28px rgba(255,95,162,.6),0 0 0 4px rgba(255,200,61,.55);
  animation:pulse 2.2s ease-in-out infinite;text-shadow:0 2px 0 rgba(0,0,0,.15);
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.toast{
  position:absolute;left:50%;top:var(--s3);transform:translateX(-50%);background:rgba(58,33,82,.9);color:#fff;border-radius:999px;
  padding:var(--s2) var(--s4);font-weight:600;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;max-width:calc(100% - 140px);overflow:hidden;text-overflow:ellipsis
}
.toast.on{opacity:1}
.app.show main{grid-template-columns:1fr}
.app.show .panel{display:none}
.app.show #frontBtn{display:none}

/* ---- panel + steps ---- */
.panel{
  min-height:0;overflow-y:auto;overflow-x:hidden;padding:var(--s2) var(--s4) 0;background:var(--surface);
  border-left:3px solid var(--line);display:flex;flex-direction:column;gap:var(--s3);
}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s1);padding:var(--s1);background:var(--surface2);border:2px solid var(--line);border-radius:999px;flex:none}
.step-tab{
  min-height:48px;border-radius:999px;border:0;background:transparent;color:var(--ink);font-weight:600;font-size:1.05rem;
  display:flex;align-items:center;justify-content:center;gap:var(--s2);padding:0 var(--s2);
}
.step-tab .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--line);font-size:.9rem;flex:none}
.step-tab[aria-selected="true"]{background:var(--accent);color:#fff;box-shadow:0 4px 12px var(--accent-soft),0 0 0 3px var(--surface);transform:translateY(-1px)}
.step-tab[aria-selected="true"] .n{background:rgba(255,255,255,.3)}
.step{display:none;flex-direction:column;gap:var(--s3);flex:none;padding-bottom:var(--s4)}
.step.on{display:flex}
.step#step-design{padding-bottom:0;gap:var(--s2)}
.hint{font-size:.95rem;color:var(--muted);margin:0;font-weight:500}

/* Dress */
.dresses{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2)}
.chip{
  position:relative;min-height:132px;border-radius:var(--r);border:3px solid var(--line);background:var(--surface2);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);padding:var(--s2) var(--s1);font-size:clamp(.78rem,1.9vw,1rem);font-weight:600;min-width:0;
}
.chip canvas{width:min(92px,100%);aspect-ratio:1/1;height:auto;display:block}
.chip[aria-pressed="true"]{border-color:var(--accent);border-width:4px;background:var(--accent-soft);transform:translateY(-3px);box-shadow:0 8px 20px var(--accent-soft)}
.chip[aria-pressed="true"]::after{
  content:'\2713';position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:.85rem;font-weight:700;
}
.chip[aria-pressed="true"]:active{transform:translateY(-3px) scale(.96)}

/* Design */
.design-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s3);align-items:start}
.rail{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s1) var(--s2) var(--s1) var(--s1)}
.tool{
  width:48px;height:48px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface2);color:var(--ink);font-size:1.5rem;padding:0;
  display:grid;place-items:center;flex:none;
}
.canvas-col{display:flex;justify-content:center;min-width:0}
.paint-wrap{
  position:relative;flex:none;width:min(100%,max(240px,calc(100vh - 560px)));width:min(100%,max(240px,calc(100dvh - 560px)));aspect-ratio:1/1;
  border-radius:var(--r);overflow:hidden;border:3px solid var(--accent);background:#fff;touch-action:none;box-shadow:var(--shadow);
}
.paint-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;pointer-events:none}
.optstrip{min-height:72px;display:flex;align-items:center;justify-content:center;padding:var(--s1) var(--s2);min-width:0;background:var(--surface2);border-radius:var(--r);border:2px solid var(--line)}
.opt{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;justify-content:center}
.opt{max-width:100%}
.btn.pat{padding:0;width:48px;overflow:hidden}
.btn.pat canvas{width:36px;height:36px;border-radius:8px;display:block;pointer-events:none}
.btn[data-size]{padding:0;width:48px}
.btn.bk{padding:0;width:48px;font-size:1.25rem}
.orow{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;justify-content:center;max-width:100%}
.optlab{font-size:.85rem;font-weight:600;color:var(--muted);min-width:56px;text-align:right}
.opt[data-opt="size"]{flex-direction:column;flex-wrap:nowrap;gap:var(--s1)}
.opt.grid{padding:var(--s1) 0}
.btn.grad{padding:0;width:48px;font-size:1.3rem;border-color:rgba(0,0,0,.14);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,48px);gap:var(--s1);padding:6px 4px;justify-content:space-between;min-width:0}
.sw{
  width:48px;height:48px;border-radius:50%;border:3px solid rgba(0,0,0,.14);padding:0;position:relative;
}
.sw[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.08);box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--accent);z-index:1}
.sw.rainbow{background:conic-gradient(#ff3b6b,#ffd400,#8de03a,#14b8a6,#3b6cf6,#d946ef,#ff3b6b)}
.sw.metal::after{content:'';position:absolute;inset:7px 12px 22px 9px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(2px);transform:rotate(-30deg)}
.actions{
  position:sticky;bottom:0;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);padding:var(--s1) 0 10px;background:var(--surface);
}
.actions .btn{min-height:52px}
.actions .btn.warn{color:var(--pink-d)}

/* Style */
.groups{display:flex;flex-direction:column;gap:var(--s2)}
.group{background:var(--surface2);border:2px solid var(--line);border-radius:var(--r);padding:var(--s2) var(--s3);display:flex;flex-direction:column;gap:var(--s1)}
.group h3{margin:0;font-size:1rem;font-weight:700;color:var(--ink)}
.swrow{display:flex;flex-wrap:wrap;gap:2px var(--s1);padding:0}
.swrow .sw{width:48px;height:48px;border:0;background:transparent;border-radius:50%}
.swrow .sw::before{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--c);border:2px solid rgba(0,0,0,.18)}
.swrow .sw[aria-pressed="true"]{transform:none;box-shadow:inset 0 0 0 3px var(--accent)}
.swrow .sw[aria-pressed="true"]::before{border-color:var(--ink)}
.swrow .btn{min-height:48px;padding:0 var(--s3);font-size:.95rem}

/* runway: compact stage + music control */
.show-ctl{position:absolute;left:var(--s3);bottom:var(--s4);z-index:6}
.show-pop{
  position:absolute;left:var(--s3);bottom:calc(var(--s4) + 60px);z-index:7;width:min(340px,calc(100% - 24px));max-height:calc(100% - 100px);overflow-y:auto;
  background:var(--surface);color:var(--ink);border:3px solid var(--accent);border-radius:var(--r);padding:var(--s3);box-shadow:0 14px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:var(--s2);
}
.show-pop h4{margin:0 0 var(--s1);font-size:.95rem;font-weight:600;color:var(--muted)}
.prow{display:flex;flex-wrap:wrap;gap:var(--s2)}
.prow .btn{flex-direction:column;gap:0;min-height:56px;padding:0 var(--s2);font-size:.85rem;line-height:1.1;min-width:64px}
.prow .btn .e{font-size:1.35rem;line-height:1.2}

/* flash FX */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.burst{
  position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;
  background:radial-gradient(circle,#fff 0 10%,rgba(255,255,255,.75) 24%,rgba(255,240,200,.2) 45%,transparent 66%);
  animation:burst .5s ease-out forwards;
}
@keyframes burst{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.9);opacity:0}}
.whiteflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.whiteflash.go{animation:wf .45s ease-out}
@keyframes wf{0%{opacity:.45}100%{opacity:0}}
/* photo overlay */
.overlay{
  position:fixed;inset:0;z-index:50;background:rgba(30,10,50,.78);display:flex;align-items:center;justify-content:center;padding:var(--s4);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.card{
  background:var(--surface);border-radius:24px;padding:var(--s4);max-width:min(94vw,820px);max-height:94dvh;display:flex;flex-direction:column;gap:var(--s3);
  align-items:center;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:auto;
}
.card img{max-width:100%;max-height:62dvh;border-radius:14px;display:block;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.card a.btn,.card button.btn{text-decoration:none;color:inherit}
.photo-note{margin:0;font-weight:500;color:var(--muted);text-align:center}
.row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;justify-content:center}

/* portrait / narrow: stage on top (~45%), panel below */
@media (max-aspect-ratio: 1/1), (max-width: 760px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,45%) minmax(0,1fr)}
  .panel{border-left:0;border-top:3px solid var(--line)}
  .app.show main{grid-template-rows:1fr}
  .design-main{grid-template-columns:1fr}
  .rail{flex-direction:row;order:2;justify-content:space-between;gap:var(--s1);padding:var(--s2) var(--s1)}
  .tool{flex:1 1 0;max-width:64px;min-width:48px}
  .paint-wrap{width:min(100%,max(240px,36dvh))}
  .chip{min-height:116px}
}
@media (min-width:700px) and (max-aspect-ratio:1/1){
  /* tablet portrait: canvas + rail on the left, options / colors / undo on the right so nothing needs scrolling */
  .step#step-design.on{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto auto auto 1fr;column-gap:var(--s3);row-gap:var(--s3);align-items:start}
  .design-main{grid-column:1;grid-row:1/5}
  .optstrip{grid-column:2;grid-row:1}
  .palette{grid-column:2;grid-row:2}
  .actions{grid-column:2;grid-row:3;position:static;padding:0}
  .paint-wrap{width:min(100%,max(240px,38dvh))}
}
@media (max-width: 520px){
  header{padding:var(--s2) var(--s4)}
  .runway-btn{font-size:1.2rem;min-height:60px;padding-inline:var(--s5)}
  .step-tab{font-size:.95rem;gap:var(--s1)}
  .step-tab .n{width:22px;height:22px;font-size:.8rem}
  .back-btn{font-size:1rem;padding:0 var(--s4)}
  .toast{max-width:calc(100% - 100px)}
  .paint-wrap{width:min(100%,max(220px,28dvh))}
  main{grid-template-rows:minmax(0,37%) minmax(0,1fr)}
  .app.show main{grid-template-rows:1fr}
}
@media (prefers-reduced-motion: reduce){
  .btn,.tool,.chip,.sw,.step-tab,.round,.iconbtn,.runway-btn,.back-btn{transition:none}
  .btn:active,.tool:active,.chip:active,.sw:active,.step-tab:active,.round:active,.iconbtn:active,.back-btn:active,.runway-btn:active{transform:none}
  .runway-btn{animation:none}
  .toast{transition:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>Fashion Studio Runway</h1>
    <div class="hright">
      <button class="iconbtn" id="muteBtn" aria-label="Mute music" title="Music on/off">🔊</button>
      <button class="iconbtn" id="nameBtn" aria-label="Settings: your name" aria-expanded="false" title="Your name">✏️</button>
    </div>
  </header>
  <div class="pop hidden" id="namePop" role="dialog" aria-label="Settings">
    <label for="nameInput">✏️ Your name</label>
    <input id="nameInput" type="text" maxlength="18" placeholder="Your name" autocomplete="off" autocapitalize="words" spellcheck="false">
    <p class="hint">Shows on the runway banner. You can leave it empty.</p>
    <button class="btn primary" id="nameDone">Done</button>
  </div>
  <main>
    <section class="stage" id="stage">
      <canvas id="gl"></canvas>
      <div class="fx" id="fx"><div class="whiteflash" id="wflash"></div></div>
      <div class="exit-wrap hidden" id="exitWrap"><button class="back-btn" id="exitBtn">⬅ Back to Studio</button></div>
      <div class="stage-tools">
        <button class="round" id="photoBtn" aria-label="Take photo" title="Photo">📸</button>
        <button class="round" id="frontBtn" aria-label="Front view" title="Front view">🔄</button>
      </div>
      <div class="stage-ui" id="stageUi"><button class="runway-btn" id="runwayBtn">✨ Runway Show!</button></div>
      <div class="show-ctl"><button class="round" id="ctlBtn" aria-label="Stage and music" aria-expanded="false" title="Stage &amp; music">🎭</button></div>
      <div class="show-pop hidden" id="ctlPop" role="dialog" aria-label="Stage and music">
        <div><h4>🎨 Stage</h4><div class="prow" id="themeRow"></div></div>
        <div><h4>🎵 Music</h4><div class="prow" id="musicRow"></div></div>
      </div>
      <div class="toast" id="toast" role="status"></div>
    </section>
    <section class="panel" id="panel">
      <div class="steps" role="tablist" aria-label="Steps">
        <button class="step-tab" role="tab" aria-selected="true" data-step="dress"><span class="n">1</span>Dress</button>
        <button class="step-tab" role="tab" aria-selected="false" data-step="design"><span class="n">2</span>Design</button>
        <button class="step-tab" role="tab" aria-selected="false" data-step="style"><span class="n">3</span>Style</button>
      </div>

      <div class="step on" id="step-dress">
        <p class="hint">Pick your dress shape</p>
        <div class="dresses" id="dresses"></div>
        <button class="btn primary big" data-goto="design">Next: Design ➡</button>
      </div>

      <div class="step" id="step-design">
        <div class="design-main">
          <div class="rail" role="toolbar" aria-label="Tools">
            <button class="tool" data-tool="brush" aria-pressed="true" aria-label="Brush" title="Brush">✏️</button>
            <button class="tool" data-tool="rainbow" aria-pressed="false" aria-label="Rainbow" title="Rainbow">🌈</button>

    setTrack(id) { if (!TR[id]) return; track = id; bpm = TR[id].bpm; sp = 60 / bpm / 4; step = 0; if (ctx) nextT = ctx.currentTime + .05; },
    setMuted(m) { if (master) master.gain.setTargetAtTime(m ? 0 : .55, ctx.currentTime, .03); },

})();
const muteBtn = $('#muteBtn');
function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; muteBtn.setAttribute('aria-label', muted ? 'Unmute music' : 'Mute music'); }
muteBtn.addEventListener('click', () => { muted = !muted; audio.setMuted(muted); refreshMute(); saveState(); });

/* ============================================================================
   Runway show
   ============================================================================ */
const show = { on: false, poseId: 0, nextPose: 0, state: 'walkIn', t: 0, z: -5, yaw: 0, phase: 0, flashes: 0, y0: 0, camMode: 'orbit', saved: null, flashBoost: 0, camT: 0, bpmT: 0 };
const appEl = $('#app'); const fx = $('#fx');
function burst(n = 4) {
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const b = document.createElement('div'); b.className = 'burst'; b.style.left = (10 + Math.random() * 80) + '%'; b.style.top = (10 + Math.random() * 55) + '%';
      fx.appendChild(b); setTimeout(() => b.remove(), 600);
    }, i * 70);
  }
  show.flashBoost = 1; wflash();
}
function wflash() { const w = $('#wflash'); w.classList.remove('go'); void w.offsetWidth; w.classList.add('go'); }
function showCamPos() {
  const asp = camera.aspect; const extra = Math.max(0, 1.3 - asp) * 2.4;
  return new THREE.Vector3(0, 1.3, 6.9 + extra);
}
function startShow() {
  if (show.on) return; show.on = true; appEl.classList.add('show');
  $('#runwayBtn').classList.add('hidden'); $('#exitWrap').classList.remove('hidden');
  show.saved = { pos: camera.position.clone(), target: controls.target.clone() };
  show.camMode = 'show'; controls.enabled = false;
  show.state = 'walkIn'; show.t = 0; show.z = -5; show.yaw = 0; show.phase = 0; show.nextPose = Math.floor(Math.random() * POSES.length);
  stage.visible = true; pedestal.visible = false; scene.background = bgShow; applyLights(); closeCtl();
  audio.start(); audio.setMuted(muted);
  requestAnimationFrame(resize);
}
function stopShow() {
  if (!show.on) return; show.on = false; appEl.classList.remove('show'); audio.stop();
  $('#runwayBtn').classList.remove('hidden'); $('#exitWrap').classList.add('hidden');
  stage.visible = false; pedestal.visible = true; scene.background = bgDesign; applyLights(); closeCtl();
  const c = active(); c.root.position.set(0, 0, 0); c.root.rotation.y = 0; c.walkAmt = 0; c.poseW = 0;
  sun.target.position.set(0, 0, 0); sun.position.set(2.2, 4, 3);
  show.camMode = 'return';
  requestAnimationFrame(resize);
}
$('#runwayBtn').addEventListener('click', startShow);
$('#exitBtn').addEventListener('click', stopShow);
$('#frontBtn').addEventListener('click', () => {
  if (show.on) return; show.camMode = 'return'; show.saved = { pos: new THREE.Vector3(0, 1.05, 3.5), target: new THREE.Vector3(0, .72, 0) }; controls.enabled = false;
});
function updateShow(dt) {
  const c = active(); const SPEED = 1.25; c.poseId = show.poseId;
  c.walkAmt += ((show.wTarget ?? 1) - c.walkAmt) * (1 - Math.exp(-dt * 6));
  c.poseW += ((show.pTarget ?? 0) - c.poseW) * (1 - Math.exp(-dt * 5));
  let moving = 0;
  show.t += dt;
  switch (show.state) {
    case 'walkIn':
      show.wTarget = 1; show.pTarget = 0; show.yaw = 0; show.z += SPEED * dt * c.walkAmt; moving = 1;
      if (show.z >= 2.4) { show.z = 2.4; show.state = 'pose'; show.t = 0; show.fl = [0, 0, 0]; show.poseId = show.nextPose; show.nextPose = (show.nextPose + 1) % POSES.length; c.poseId = show.poseId; toast(POSES[show.poseId].label); burst(4); }
      break;
    case 'pose':
      show.wTarget = 0; show.pTarget = 1;
      if (show.poseId === 2) show.yaw = TAU * ease(clamp((show.t - .4) / 2.2, 0, 1)); // twirl: one full spin
      else show.yaw = Math.sin(show.t * 1.5) * .28 * Math.min(1, show.t);
      if (show.t > 1.2 && !show.fl[1]) { show.fl[1] = 1; burst(5); }
      if (show.t > 2.5 && !show.fl[2]) { show.fl[2] = 1; burst(4); }
      if (show.t > 3.4) { show.state = 'turn'; show.t = 0; show.y0 = show.yaw % TAU; }
      break;
    case 'turn':
      show.wTarget = .35; show.pTarget = 0; show.yaw = show.y0 + (Math.PI - show.y0) * ease(clamp(show.t / 1.0, 0, 1));
      if (show.t >= 1.0) { show.state = 'walkOut'; show.t = 0; }
      break;
    case 'walkOut':
      show.wTarget = 1; show.pTarget = 0; show.yaw = Math.PI; show.z -= SPEED * dt * c.walkAmt; moving = 1;
      if (show.z <= -4.8) { show.z = -4.8; show.state = 'turnBack'; show.t = 0; }
      break;
    case 'turnBack':
      show.wTarget = .35; show.pTarget = 0; show.yaw = Math.PI + Math.PI * ease(clamp(show.t / 1.0, 0, 1));
      if (show.t >= 1.0) { show.state = 'walkIn'; show.t = 0; show.yaw = 0; }
      break;
  }
  const cyc = 1.55 * (show.state === 'turn' || show.state === 'turnBack' ? .6 : 1);
  show.phase += dt * Math.PI * 2 * cyc * Math.max(.2, c.walkAmt);
  c.root.position.set(0, 0, show.z); c.root.rotation.y = show.yaw;
  c.speedFx = moving * -1.5 * (show.state === 'walkOut' ? -1 : 1) * 0;
  // light follows the model for shadow
  sun.target.position.set(0, 0, show.z); sun.position.set(2.2, 4, show.z + 3);
  // edge-light chase
  show.bpmT += dt; const beat = Math.floor(show.bpmT * audio.bpm / 60 * 2); const TH = THEMES[themeId];
  edgeLights.forEach(m => { const on = ((m.userData.i + beat) % 3) === 0; m.scale.setScalar(on ? 1.5 : .9); });
  lightMatA.color.set(beat % 2 ? TH.lightA[0] : TH.lightA[1]); lightMatB.color.set(beat % 2 ? TH.lightB[0] : TH.lightB[1]);
  return c.walkAmt > .15 ? show.phase : show.phase;
}
function updateTwinkle(t) {
  const { geo, seeds, cnt } = twinkle; const col = geo.attributes.color;
  for (let i = 0; i < cnt; i++) { const v = .15 + .85 * Math.max(0, Math.sin(t * 2.2 + seeds[i] * 3)); col.array[i * 3] = v; col.array[i * 3 + 1] = v * .92; col.array[i * 3 + 2] = v * (.8 + .2 * Math.sin(seeds[i])); }
  col.needsUpdate = true;
}

/* ============================================================================
   Runway control: stage theme + music in one compact popover
   ============================================================================ */
const TRACKS = [['pop', '🎤', 'Pop'], ['dream', '🌙', 'Dreamy'], ['dance', '🪩', 'Dance']];
const ctlPop = $('#ctlPop'), ctlBtn = $('#ctlBtn');
function closeCtl() { ctlPop.classList.add('hidden'); ctlBtn.setAttribute('aria-expanded', 'false'); }
function mkOpt(row, e, label, attr, val, onClick) {
  const b = document.createElement('button'); b.className = 'btn'; b.dataset[attr] = val; b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', label);
  b.innerHTML = '<span class="e"></span><span></span>'; b.firstChild.textContent = e; b.lastChild.textContent = label; b.addEventListener('click', onClick); row.appendChild(b);
}
Object.keys(THEMES).forEach(id => mkOpt($('#themeRow'), THEMES[id].e, THEMES[id].short, 'theme', id, () => { applyTheme(id); saveState(); }));
TRACKS.forEach(([id, e, n]) => mkOpt($('#musicRow'), e, n, 'music', id, () => setMusic(id)));
function refreshShowCtl() {
  $$('#themeRow .btn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === themeId)));
  $$('#musicRow .btn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.music === musicId)));
}
let previewT = 0;
function setMusic(id) {
  musicId = id; audio.setTrack(id); saveState(); refreshShowCtl();
  if (!show.on) { audio.start(); audio.setMuted(muted); clearTimeout(previewT); previewT = setTimeout(() => { if (!show.on) audio.stop(); }, 3200); } // short preview from a tap
}
ctlBtn.addEventListener('click', e => { e.stopPropagation(); const o = ctlPop.classList.contains('hidden'); ctlPop.classList.toggle('hidden', !o); ctlBtn.setAttribute('aria-expanded', String(o)); });
document.addEventListener('pointerdown', e => { if (!ctlPop.classList.contains('hidden') && !ctlPop.contains(e.target) && !ctlBtn.contains(e.target)) closeCtl(); });

/* ============================================================================
   Photo
   ============================================================================ */
function takePhoto() {
  wflash();
  renderer.render(scene, camera);
  const src = renderer.domElement; const b = Math.round(src.width * .03), cap = Math.round(src.width * .07);
  const out = document.createElement('canvas'); out.width = src.width + b * 2; out.height = src.height + b + cap;
  const g = out.getContext('2d'); const gr = g.createLinearGradient(0, 0, out.width, out.height); gr.addColorStop(0, '#ff7ab8'); gr.addColorStop(1, '#8b5cf6');
  g.fillStyle = gr; g.fillRect(0, 0, out.width, out.height);
  g.drawImage(src, b, b);
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `600 ${Math.round(cap * .5)}px Fredoka, system-ui, sans-serif`;
  g.fillText(designerName ? `✨ Fashion Studio Runway · Designer: ${designerName} ✨` : '✨ Fashion Studio Runway ✨', out.width / 2, src.height + b + cap * .5, out.width * .94);
  let url = ''; try { url = out.toDataURL('image/png'); } catch (e) { url = src.toDataURL('image/png'); }
  $('#photoImg').src = url; const a = $('#photoSave'); a.href = url; a.download = 'fashion-photo.png';
  setTimeout(() => $('#photoOverlay').classList.remove('hidden'), 280);
}
$('#photoBtn').addEventListener('click', takePhoto);
$('#photoClose').addEventListener('click', () => $('#photoOverlay').classList.add('hidden'));
$('#photoOverlay').addEventListener('pointerdown', e => { if (e.target.id === 'photoOverlay') $('#photoOverlay').classList.add('hidden'); });
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (window.__closeNamePop && window.__closeNamePop()) return; if (!$('#photoOverlay').classList.contains('hidden')) $('#photoOverlay').classList.add('hidden'); else stopShow(); }
});

/* ============================================================================
   Main loop
   ============================================================================ */
function resize() {
  const w = Math.max(1, stageEl.clientWidth), h = Math.max(1, stageEl.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false); camera.aspect = w / h;
  // tall/narrow stage: lift the figure so the Runway button doesn't cover her shoes
  if (!show.on && w / h < 1.3) camera.setViewOffset(w, h, 0, Math.round(h * .07), w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stageEl); else window.addEventListener('resize', resize);

const clock = new THREE.Clock(); let idlePhase = 0, tAll = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05); tAll += dt;
  const c = active();
  let phase = idlePhase;
  if (show.on) {
    phase = updateShow(dt);
    if (twinkle.pts.visible) updateTwinkle(tAll);
    updateFall(dt, tAll);
  } else {
    c.walkAmt += (0 - c.walkAmt) * (1 - Math.exp(-dt * 6)); c.poseW += (0 - c.poseW) * (1 - Math.exp(-dt * 6));
  }

  sun.intensity = lerp(sun.intensity, S ? .9 * TL : 1.5, k); rim.intensity = lerp(rim.intensity, S ? .9 * TL : .6, k);
  spots.forEach(s => s.intensity = lerp(s.intensity, S ? 140 * TL : 0, k));
  spotCones.forEach(m => m.visible = S);
  c.update(dt, phase);
  // camera
  if (show.camMode === 'show') {
    const tp = showCamPos(); tp.x += Math.sin(tAll * .4) * .25; tp.y += Math.sin(tAll * .6) * .05;
    camera.position.lerp(tp, 1 - Math.exp(-dt * 2.5)); controls.target.lerp(new THREE.Vector3(0, .85, .6), 1 - Math.exp(-dt * 2.5)); camera.lookAt(controls.target);
  } else if (show.camMode === 'return') {

    if (camera.position.distanceTo(show.saved.pos) < .02) { show.camMode = 'orbit'; controls.enabled = true; controls.update(); }

}

/* ----------------------------- boot ----------------------------- */
rebuildBackgrounds();
resize();
chars[cur].group.visible = true;
audio.setTrack(musicId);
applyTheme(themeId);
refreshMute();
refreshUI();
frame();
